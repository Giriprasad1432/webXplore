<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .categories {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #items {
            display: flex;
            flex-direction: row;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            row-gap:30px;
            column-gap: 50px;
        }



        .card {
            text-align: center;
            padding: 10px;
            border-radius: 20px;
        }

        .card img {
            width: 250px;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }

        h3 {
            margin: 0px;
            padding-top: 20px;
        }

        p {
            margin: 0px;
            padding-top: 10px;
        }
    </style>
</head>

<body>
   
    <div class="categories">
        <div>
            <h1 style="margin:0px;">Explore Our Categories</h1>
            <h4 style="margin:0px;padding-left: 25px;padding-top :10px; padding-bottom: 30px;">Find everything you need
                , all in one place</h4>
        </div>
        <div id="items">
            <div class="card" style=" background-color: #fbf2f4;">
                <img src="images/Electronics.jpeg" alt="">
                <h3>Electronics</h3>
                <p>Smart gadgets and devices</p>
            </div>
            <div class="card" style="background-color: #f4fcfc;">
                <img src="images/Fashion.jpeg" alt="">
                <h3>Fashion</h3>
                <p>Style for every occasion</p>
            </div>
            <div class="card" style=" background-color: #f8f4fc;">
                <img src="images/Beauty.jpeg" alt="">
                <h3>Beauty</h3>
                <p>Feel confident,look ammazing</p>
            </div>
            <div class="card" style="background-color: #fcf3d0;">
                <img src="images/Furniture.jpeg" alt="">
                <h3>Home & Living</h3>
                <p>Make your space better</p>

            </div>
            <div class="card" style="background-color: #edebf0;">
                <img src="images/Sports.jpeg" alt="">
                <h3>Sports</h3>
                <p>Gear up and stay active</p>

            </div>
            <div class="card" style="background-color: #f1f8f8;">
                <img src="images/Toys.jpeg" alt="">
                <h3>Toys & Kids</h3>
                <p>Fun for little ones</p>
            </div>
        </div>

</body>

</html>
